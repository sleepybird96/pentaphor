name: Pentaphor
options:
  developmentLanguage: en
  knownRegions: [en, ko]
  bundleIdPrefix: app.pentaphor
  deploymentTarget:
    iOS: "17.0"
packages:
  PentaphorCore:
    path: Packages/PentaphorCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Pentaphor:
    type: application
    platform: iOS
    sources:
      - path: Pentaphor
      - path: assets/quest-art
        includes: ["*.png"]
        buildPhase: resources
    dependencies:
      - package: PentaphorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pentaphor.personal
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: NX53XT8XMU
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Pentaphor/Pentaphor.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Pentaphor/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: PENTAPHOR
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 1.0
      configs:
        Debug:
          "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Configuration/SimulatorDebug.entitlements
  PentaphorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PentaphorTests]
    dependencies:
      - target: Pentaphor
      - package: PentaphorCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PentaphorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PentaphorUITests]
    dependencies:
      - target: Pentaphor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PentaphorStoreKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PentaphorStoreKitTests
      - path: Configuration/Challenge.storekit
        buildPhase: resources
    dependencies:
      - target: Pentaphor
      - package: PentaphorCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pentaphor:
    build:
      targets:
        Pentaphor: all
        PentaphorTests: [test]
        PentaphorUITests: [test]
    test:
      targets: [PentaphorTests, PentaphorUITests]

  PentaphorStoreKitTests:
    build:
      targets:
        Pentaphor: all
        PentaphorStoreKitTests: [test]
    test:
      targets: [PentaphorStoreKitTests]
    run:
      storeKitConfiguration: Configuration/Challenge.storekit
