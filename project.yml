name: Pentaphor
options:
  bundleIdPrefix: app.pentaphor
  deploymentTarget:
    iOS: "17.0"
packages:
  PentaphorCore:
    path: Packages/PentaphorCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Pentaphor:
    type: application
    platform: iOS
    sources:
      - path: Pentaphor
      - path: assets/quest-art
        includes: ["*.png"]
        buildPhase: resources
    dependencies:
      - package: PentaphorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pentaphor.personal
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: NX53XT8XMU
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Pentaphor/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: PENTAPHOR
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 1.0
  PentaphorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PentaphorTests]
    dependencies:
      - target: Pentaphor
      - package: PentaphorCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PentaphorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PentaphorUITests]
    dependencies:
      - target: Pentaphor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pentaphor:
    build:
      targets:
        Pentaphor: all
        PentaphorTests: [test]
        PentaphorUITests: [test]
    test:
      targets: [PentaphorTests, PentaphorUITests]
